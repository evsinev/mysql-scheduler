name: Release

# Tags keep the historical format: mysql-scheduler-2.0-1 releases scheduler-2.0-1.jar
on:
  push:
    tags:
      - 'mysql-scheduler-[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scheduler

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Resolve version from tag
      run: |
        VERSION="${GITHUB_REF_NAME#mysql-scheduler-}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+-[0-9]+$ ]]; then
          echo "::error::Tag $GITHUB_REF_NAME is not mysql-scheduler-<major>.<minor>-<build>"
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    # pom.xml stays at -SNAPSHOT in git; the release version comes from the tag
    - name: Set Maven project version
      run: |
        mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false

    - name: Build
      run: mvn -B verify

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ASSET="target/scheduler-${VERSION}.jar"
        test -f "$ASSET"
        (cd target && sha256sum "scheduler-${VERSION}.jar" > "scheduler-${VERSION}.jar.sha256")
        gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes \
          --verify-tag
